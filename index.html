<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- ЗАГРУЖАЕМ БАЗУ ЧЕРЕЗ СТАБИЛЬНЫЙ CDN CLOUDFLARE -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --blur: blur(45px); }
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; padding-bottom: 100px; overflow-x: hidden; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); backdrop-filter: var(--blur); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; backdrop-filter: var(--blur); }
        .card h3 { margin: 0 0 8px 0; font-size: 20px; font-weight: 800; text-transform: lowercase; }
        .card span { font-size: 10px; color: var(--neon); opacity: 0.7; letter-spacing: 2px; display: block; margin-bottom: 10px; }
        audio { width: 100%; height: 40px; border-radius: 12px; filter: invert(1) hue-rotate(180deg); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; cursor: pointer; z-index: 2000; border: none; font-weight: bold; }
        .modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; padding: 60px 25px; z-index: 3000; }
        .modal.active { display: flex; }
        input, .file-label { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 18px; color: white; margin-bottom: 12px; outline: none; font-size: 16px; display: block; text-align: center; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn-post { background: var(--neon); color: white; padding: 20px; border-radius: 18px; text-align: center; font-weight: 800; cursor: pointer; border: none; font-size: 16px; margin-top: 10px; width: 100%; }
        #loader { display: none; text-align: center; margin-top: 30px; color: var(--neon); font-weight: 700; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--neon); animation: spin 1s linear infinite; margin: 15px auto 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="nav"><div class="logo">cotakbass</div></div>
    <div class="container" id="feed"><p style="text-align:center; opacity:0.3; margin-top:50px;">Подключение к платформе...</p></div>
    
    <button class="fab" onclick="document.getElementById('postModal').classList.add('active')">+</button>

    <div class="modal" id="postModal">
        <h2 style="text-align: center; margin-bottom: 30px;">Загрузить трек</h2>
        <input type="text" id="tTitle" placeholder="Название трека">
        <input type="text" id="uName" placeholder="Твой ник">
        <label class="file-label" for="fileInput" id="fileStatus">Выбрать MP3 из галереи</label>
        <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3" style="display: none;" onchange="onFileSelected()">
        
        <button class="btn-post" id="upBtn" onclick="handleUpload()">Опубликовать</button>
        
        <div id="loader">
            <div id="loadText">ТРЕК ЗАГРУЖАЕТСЯ В ОБЛАКО...</div>
            <div class="spinner"></div>
        </div>
        
        <p onclick="document.getElementById('postModal').classList.remove('active')" id="cancelBtn" style="text-align: center; margin-top: 30px; opacity: 0.4; cursor: pointer;">Отмена</p>
    </div>

    <script>
        const S_URL = "https://supabase.co";
        const S_KEY = "sb_publishable_YnpxQyq_9cv80tgAYgOjg_u6eYV1rCq2R4x-8IqSNCG-rLh-N68f_L5QJz6nQY_2S5U4v5p_Vv"; 
        let sb = null;
        let savedFile = null;

        // Инициализация пульта управления базой данных
        const checkBase = setInterval(() => {
            if (window.supabase) {
                sb = window.supabase.createClient(S_URL, S_KEY);
                loadFeed();
                clearInterval(checkBase);
            }
        }, 500);

        function onFileSelected() {
            const fileInput = document.getElementById('fileInput');
            if(fileInput.files.length > 0) {
                // ИСПРАВЛЕНО: Достаем конкретный первый файл из списка
                savedFile = fileInput.files[0]; 
                // ИСПРАВЛЕНО: Безопасно обрезаем имя для красивого статуса кнопки
                const displayFileName = savedFile.name.length > 15 ? savedFile.name.substring(0, 15) + "..." : savedFile.name;
                document.getElementById('fileStatus').innerText = "Файл выбран: " + displayFileName;
            }
        }

        async function loadFeed() {
            const feed = document.getElementById('feed');
            try {
                const { data } = await sb.from('posts').select('*').order('id', { ascending: false });
                feed.innerHTML = "";
                if(!data || data.length === 0) {
                    feed.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:50px;'>Лента пуста. Добавь первый трек!</p>";
                    return;
                }
                data.forEach(item => {
                    feed.innerHTML += `
                        <div class="card">
                            <span>RELEASE FROM GALLERY</span>
                            <h3>${item.title.toLowerCase()}</h3>
                            <audio controls src="${item.link}"></audio>
                        </div>
                    `;
                });
            } catch (e) { feed.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:50px;'>Нажми +, чтобы загрузить трек</p>"; }
        }

        async function handleUpload() {
            const title = document.getElementById('tTitle').value;
            const user = document.getElementById('uName').value;

            if (!title || !user || !savedFile) return alert("Заполни все поля и выбери файл!");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('upBtn').style.display = 'none';

            // Генерируем чистое имя файла без спецсимволов
            const cleanFileName = Date.now() + "_" + savedFile.name.replace(/[^a-z0-9.]/gi, '_');

            try {
                // 1. Загружаем бинарный поток напрямую со смартфона в бакет music
                const { error: upErr } = await sb.storage.from('music').upload(cleanFileName, savedFile);
                if (upErr) throw upErr;

                // 2. Получаем прямую публичную ссылку
                const { data: { publicUrl } } = sb.storage.from('music').getPublicUrl(cleanFileName);

                // 3. Записываем информацию в таблицу базы posts
                const { error: dbErr } = await sb.from('posts').insert([{ title: user + " - " + title, author: user, link: publicUrl }]);
                if (dbErr) throw dbErr;

                location.reload();
            } catch (err) {
                alert("Ошибка публикации: " + err.message + ". Попробуй еще раз.");
                document.getElementById('loader').style.display = 'none';
                document.getElementById('upBtn').style.display = 'block';
            }
        }
    </script>
</body>
</html>
