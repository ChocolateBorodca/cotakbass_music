<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* GIF ФОН */
        #bg-gif {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5;
            transition: opacity 1.5s ease;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: -1; }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 2000;
        }
        .logo-center {
            font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.4s cubic-bezier(0.15, 0, 0.2, 1);
        }
        .btn:active { transform: scale(0.9); }

        /* ЭКРАНЫ */
        .screen {
            position: absolute; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.9); backdrop-filter: var(--blur); z-index: 1000;
        }
        .screen.active { display: flex; }

        /* ПЛЕЕР (SOUNDCLOUD EMBED) */
        .player-container {
            width: 100%; max-width: 500px; margin: 10vh auto 0;
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 25px; overflow: hidden; backdrop-filter: var(--blur);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* ПОИСК */
        .search-box {
            width: 100%; background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px 20px; box-sizing: border-box;
            display: flex; align-items: center; position: relative;
        }
        .search-box input { background: none; border: none; color: white; width: 85%; font-size: 18px; outline: none; }
        .search-confirm { color: var(--neon); font-weight: 900; font-size: 22px; cursor: pointer; position: absolute; right: 20px; }

        /* СПИСКИ */
        .list { margin-top: 20px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        /* ПРОФИЛЬ */
        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--neon); background: var(--glass);
            margin: 15vh auto 0; display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2); position: relative;
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .fav-title { font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="nav-prof" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- ЭКРАН ПЛЕЕРА -->
    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-container" id="sc-wrapper">
            <!-- Сюда вставляется плеер -->
            <iframe id="sc-iframe" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" 
                src="https://soundcloud.com">
            </iframe>
        </div>
        <div style="text-align: center; margin-top: 30px; opacity: 0.4; font-size: 10px; letter-spacing: 2px;">SC ENGINE ACTIVE</div>
    </div>

    <!-- БИБЛИОТЕКА -->
    <div id="lib-screen" class="screen">
        <div class="fav-title">favorites</div>
        <div class="list" id="fav-list">
            <!-- Пример твоих треков -->
            <iframe width="100%" height="450" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2037897440&color=%233d0000&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe><div style="font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;"><a href="https://soundcloud.com/mappium" title="mappium" target="_blank" style="color: #cccccc; text-decoration: none;">mappium</a> · <a href="https://soundcloud.com/mappium/fortuna812-rubytower-shipy-heavenlymalice-prod-yukionline9lives" title="фортуна⋆812 - rubytower + @ШИПЫ @heavenlymalice (prod. YukiOnline,9lives)" target="_blank" style="color: #cccccc; text-decoration: none;">фортуна⋆812 - rubytower + @ШИПЫ @heavenlymalice (prod. YukiOnline,9lives)</a></div>
            <div class="item" onclick="loadTrack('1149727453')"><div><b>NIGHTCRAWLER</b><br><small>Travis Scott</small></div> <div class="btn" style="width:40px; height:40px">▶</div></div>
            <div class="item" onclick="loadTrack('275210960')"><div><b>STARBOY</b><br><small>The Weeknd</small></div> <div class="btn" style="width:40px; height:40px">▶</div></div>
        </div>
    </div>

    <!-- ПОИСК -->
    <div id="search-screen" class="screen">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <div class="search-confirm">?</div>
        </div>
        <div class="list" id="search-list">
            <div style="text-align:center; opacity:0.3; margin-top:50px;">Ищи треки из библиотеки...</div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="prof-screen" class="screen">
        <div class="profile-circle" id="prof-upload">
            <span id="plus" style="font-size:50px; color:var(--neon);">+</span>
            <img id="ava-img" style="display:none">
        </div>
        <div class="fav-title" style="margin-top: 30px;">profile</div>
    </div>

    <input type="file" id="file-up" style="display:none" accept="image/*">

    <script>
        const USER = "ChocolateBorodca";
        const REPO = "cotakbass_music";

        let gifs = [], curScreen = 'player-screen';

        // Загрузка гифок из твоего GitHub
        async function loadGifs() {
            try {
                const res = await fetch(`https://github.com{USER}/${REPO}/contents/bg`);
                if (res.ok) {
                    const data = await res.json();
                    gifs = data.filter(f => f.name.toLowerCase().endsWith('.gif')).map(f => f.download_url);
                    changeBg();
                }
            } catch (e) { console.log("Gifs error"); }
        }

        function changeBg() {
            if(gifs.length > 0) {
                document.getElementById('bg-gif').src = gifs[Math.floor(Math.random() * gifs.length)];
            }
        }

        function toggleScreen(id) {
            const screen = document.getElementById(id);
            if (curScreen === id) {
                screen.classList.remove('active');
                curScreen = 'player-screen';
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
                curScreen = id;
            }
        }

        // Функция смены трека в Саундклауде
        function loadTrack(trackId) {
            const iframe = document.getElementById('sc-iframe');
            iframe.src = `https://soundcloud.com{trackId}&color=%23a020f0&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
            changeBg();
            toggleScreen(curScreen); // Возвращаемся в плеер
        }

        // Аватарка
        document.getElementById('prof-upload').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById('ava-img');
                img.src = ev.target.result;
                img.style.display = 'block';
                document.getElementById('plus').style.display = 'none';
                document.getElementById('nav-prof').style.boxShadow = "0 0 15px #A020F0";
                document.getElementById('nav-prof').style.borderColor = "#A020F0";
            };
            reader.readAsDataURL(e.target.files);
        };

        loadGifs();
    </script>
</body>
</html>
