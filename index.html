<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <!-- Загружаем API YouTube -->
    <script src="https://youtube.com"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.08); --blur: blur(45px); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
        
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.4; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* Навигация */
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 5000; }
        .logo-center { font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 15px var(--neon); position: absolute; left: 50%; transform: translateX(-50%); }

        .btn { width: 52px; height: 52px; border-radius: 50%; background: var(--glass); backdrop-filter: var(--blur); border: 1px solid rgba(160, 32, 240, 0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: 0.3s; }
        .btn:active { transform: scale(0.9); }

        /* Плеер */
        .player-ui { position: relative; margin-top: 20vh; padding-left: 5%; z-index: 100; }
        .track-title { font-size: 44px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 5px; min-height: 50px; text-transform: lowercase; }
        .artist-name { font-size: 18px; color: var(--neon); opacity: 0.8; margin-bottom: 50px; }
        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 68px; height: 68px; font-size: 24px; border: 1px solid rgba(255,255,255,0.1); }

        /* Экраны */
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 110px 25px 25px; background: #000; z-index: 4000; }
        .screen.active { display: flex; }
        
        /* Поиск */
        .search-box { width: 100%; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; box-sizing: border-box; }
        .search-box input { background: none; border: none; color: white; width: 100%; font-size: 18px; outline: none; }
        .res-list { overflow-y: auto; flex-grow: 1; margin-top: 20px; }
        .item { padding: 20px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* Профиль */
        .profile-circle { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--neon); background: var(--glass); margin: 10vh auto 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 50px; color: var(--neon); cursor: pointer; }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* СКРЫТЫЙ ПЛЕЕР (ТОЛЬКО ЗВУК) */
        #yt-engine { position: absolute; top: -1000px; left: -1000px; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>

    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" onclick="toggleScreen('prof')">👤</div>
            <div class="btn" onclick="toggleScreen('search')">?</div>
        </div>
    </div>

    <!-- ТВОЙ ИНТЕРФЕЙС -->
    <div class="player-ui">
        <div id="m-title" class="track-title">напиши хуйню</div>
        <div id="m-author" class="artist-name">в поиске...</div>
        <div class="controls">
            <div class="btn" onclick="prevTrack()">❮</div>
            <div class="btn" id="play-btn" style="border-color: var(--neon)" onclick="togglePlay()">▶</div>
            <div class="btn" onclick="nextTrack()">❯</div>
        </div>
    </div>

    <!-- СКРЫТЫЙ ДВИЖОК YouTube -->
    <div id="yt-engine"></div>

    <!-- ЭКРАН ПОИСКА -->
    <div id="search" class="screen">
        <div class="search-box">
            <input type="text" id="s-input" placeholder="напиши хуйню..." oninput="searchMusic(this.value)">
        </div>
        <div id="s-results" class="res-list"></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="prof" class="screen">
        <div class="profile-circle" id="prof-btn">+<img id="ava-img" style="display:none"></div>
    </div>

    <div id="lib" class="screen"><div style="text-align:center; color:var(--neon); letter-spacing:5px;">FAVORITES</div></div>

    <script>
        let player, isPlaying = false, playlist = [];

        // Инициализация невидимого плеера
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-engine', {
                height: '1', width: '1',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) nextTrack();
        }

        // ЖИВОЙ ПОИСК (Работает через Apple API для скорости, но играет с YouTube)
        async function searchMusic(q) {
            if (q.length < 3) return;
            const res = await fetch(`https://apple.com{encodeURIComponent(q)}&media=music&limit=15`);
            const data = await res.json();
            const list = document.getElementById('s-results');
            list.innerHTML = "";
            data.results.forEach(t => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div><b>${t.trackName}</b><br><small>${t.artistName}</small></div> <div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => {
                    playSong(t.trackName, t.artistName);
                    toggleScreen('search');
                };
                list.appendChild(div);
            });
        }

        function playSong(title, artist) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-author').innerText = artist;
            // Хакерский поиск id на YouTube и запуск
            // Для теста используем первый попавшийся трек, в реальности можно докрутить
            player.loadVideoById('dQw4w9WgXcQ'); // Заменится на поиск по API
            isPlaying = true;
            document.getElementById('play-btn').innerText = "Ⅱ";
        }

        function togglePlay() {
            if(isPlaying) player.pauseVideo(); else player.playVideo();
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerText = isPlaying ? "Ⅱ" : "▶";
        }

        function toggleScreen(id) {
            const s = document.getElementById(id);
            if(s.classList.contains('active')) s.classList.remove('active');
            else { document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); s.classList.add('active'); }
        }

        // Аватарка
        document.getElementById('prof-btn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = document.getElementById('ava-img');
                    img.src = ev.target.result; img.style.display = 'block';
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        };
    </script>
</body>
</html>
