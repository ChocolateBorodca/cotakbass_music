<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden;
        }

        /* GIF ФОН */
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.5; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 5000;
        }
        .logo-center { font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 15px var(--neon); text-transform: lowercase; position: absolute; left: 50%; transform: translateX(-50%); }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.3s;
        }

        /* ПЛЕЕР */
        .player-container { margin-top: 18vh; padding-left: 5%; z-index: 100; position: relative; }
        .album-small { font-size: 14px; color: var(--neon); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; font-weight: 600; }
        
        /* КОНТЕЙНЕР ЯНДЕКСА (МАКСИМАЛЬНО ЧИСТЫЙ) */
        .yandex-box {
            width: 90%; max-width: 450px;
            border-radius: 20px; overflow: hidden;
            background: var(--glass); border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        /* ЭКРАНЫ */
        .screen { 
            position: fixed; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px; 
            background: rgba(0,0,0,0.98); backdrop-filter: var(--blur); z-index: 4000; 
        }
        .screen.active { display: flex; }

        /* ПРОФИЛЬ КРУГ */
        .profile-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .profile-circle { 
            width: 180px; height: 180px; border-radius: 50%; 
            border: 2px solid var(--neon); background: var(--glass); 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; font-size: 50px; color: var(--neon); cursor: pointer; 
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" onclick="toggleScreen('prof')">👤</div>
            <div class="btn" onclick="toggleScreen('search')">?</div>
        </div>
    </div>

    <!-- ТВОЙ ВИЗУАЛЬНЫЙ ПЛЕЕР -->
    <div class="player-container">
        <div class="album-small">мрачные треды</div>
        
        <div class="yandex-box">
            <!-- Плеер Яндекса (высота настроена так, чтобы кнопки были под рукой) -->
            <iframe frameborder="0" style="border:none;width:100%;height:180px;" width="100%" height="180" src="https://yandex.ru"></iframe>
        </div>
    </div>

    <!-- ЭКРАНЫ -->
    <div id="prof" class="screen">
        <div class="profile-container">
            <div class="profile-circle" id="prof-btn">+<img id="ava-img" style="display:none"></div>
        </div>
    </div>

    <div id="lib" class="screen"><div style="text-align:center; color:var(--neon); letter-spacing:5px;">FAVORITES</div></div>
    <div id="search" class="screen"><div style="text-align:center; color:var(--neon); letter-spacing:5px;">SEARCH</div></div>

    <input type="file" id="file-up" style="display:none" accept="image/*">

    <script>
        function toggleScreen(id) {
            const s = document.getElementById(id);
            if (s.classList.contains('active')) {
                s.classList.remove('active');
            } else {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                s.classList.add('active');
            }
        }

        document.getElementById('prof-btn').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('ava-img').src = ev.target.result;
                document.getElementById('ava-img').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files);
        };
    </script>
</body>
</html>
