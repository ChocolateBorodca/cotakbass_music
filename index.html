<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.05);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden;
        }

        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.4; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 9000;
        }
        .logo-center { font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 15px var(--neon); position: absolute; left: 50%; transform: translateX(-50%); cursor: pointer; }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur);
            border: 1px solid rgba(160, 32, 240, 0.3); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.3s;
        }
        .btn:active { transform: scale(0.9); }

        /* ПЛЕЕР */
        .main-player { margin-top: 18vh; padding-left: 5%; z-index: 100; position: relative; }
        .album-tag { font-size: 14px; color: var(--neon); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .track-title { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 5px; }
        .artist-name { font-size: 18px; opacity: 0.5; margin-bottom: 40px; }

        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 65px; height: 65px; font-size: 24px; border-color: rgba(255,255,255,0.1); }

        /* СКРЫТЫЙ ДВИЖОК ЯНДЕКСА */
        .yandex-hidden {
            position: absolute;
            top: 0; left: 0;
            width: 300px; height: 100px;
            opacity: 0; z-index: 500;
            pointer-events: auto; /* Позволяет кликать в него */
        }

        /* ЭКРАНЫ */
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 110px 25px 25px; background: rgba(0,0,0,0.98); backdrop-filter: var(--blur); z-index: 8000; }
        .screen.active { display: flex; }
        .section-title { font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-align: center; margin-bottom: 30px; }

        .profile-circle { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--neon); background: var(--glass); margin: 10vh auto; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 50px; color: var(--neon); cursor: pointer; }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib')">☰</div>
        <div class="logo-center" onclick="location.reload()">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" onclick="toggleScreen('prof')">👤</div>
            <div class="btn" onclick="toggleScreen('search')">?</div>
        </div>
    </div>

    <!-- ТВОЙ ВИЗУАЛ -->
    <div class="main-player">
        <div class="album-tag">мрачные треды</div>
        <div class="track-title">web 2.0</div>
        <div class="artist-name">тёмный принц</div>

        <div class="controls">
            <div class="btn">❮</div>
            <div class="btn" style="border-color: var(--neon); box-shadow: 0 0 25px rgba(160, 32, 240, 0.4);">▶</div>
            <div class="btn">❯</div>

            <!-- НЕВИДИМЫЙ ЯНДЕКС - КЛИКИ УХОДЯТ СЮДА -->
            <div class="yandex-hidden">
                <iframe id="yandex-engine" frameborder="0" style="border:none;width:100%;height:100px;" src="https://yandex.ru"></iframe>
            </div>
        </div>
    </div>

    <!-- ЭКРАНЫ -->
    <div id="prof" class="screen">
        <div class="profile-circle" id="prof-btn">+<img id="ava-img" style="display:none"></div>
        <div class="section-title">PROFILE</div>
    </div>

    <div id="lib" class="screen"><div class="section-title">FAVORITES</div></div>
    
    <div id="search" class="screen">
        <div class="section-title">SEARCH</div>
        <div style="background:var(--glass); border:1px solid var(--border); border-radius:20px; padding:20px; text-align:center;">
            Напиши название трека...
        </div>
    </div>

    <input type="file" id="file-up" style="display:none" accept="image/*">

    <script>
        function toggleScreen(id) {
            const s = document.getElementById(id);
            if (s.classList.contains('active')) {
                s.classList.remove('active');
            } else {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                s.classList.add('active');
            }
        }

        // Аватарка
        document.getElementById('prof-btn').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('ava-img').src = ev.target.result;
                document.getElementById('ava-img').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files);
        };
    </script>
</body>
</html>
