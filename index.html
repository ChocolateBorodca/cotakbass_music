<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(160, 32, 240, 0.25);
            --blur: blur(35px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* GIF ФОН */
        #bg-canvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5;
            transition: opacity 0.8s ease;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: -1; }

        /* Навигация */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 1000;
        }
        .logo {
            font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        /* Кнопки Liquid Glass */
        .circle-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .circle-btn:active { transform: scale(0.85); background: rgba(160, 32, 240, 0.15); }

        /* Экраны */
        .screen {
            position: absolute; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        }
        .screen.active { display: flex; }

        /* ПЛЕЕР */
        .player-ui { text-align: left; margin-top: 12vh; transition: 0.5s; }
        .t-title { font-size: 46px; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-bottom: 10px; }
        .t-author { font-size: 19px; color: var(--neon); font-weight: 300; margin-bottom: 50px; opacity: 0.9; }
        .controls { display: flex; gap: 20px; }
        .controls .circle-btn { width: 65px; height: 65px; font-size: 26px; }

        /* ПОИСК */
        .search-box {
            position: relative; width: 100%; background: var(--glass); 
            backdrop-filter: var(--blur); border: 1px solid var(--border);
            border-radius: 22px; padding: 18px 20px; box-sizing: border-box;
        }
        .search-box input {
            background: none; border: none; color: white; width: 85%; font-size: 18px; outline: none;
        }
        .search-icon-inner { position: absolute; right: 20px; color: var(--neon); font-weight: 800; font-size: 20px; }

        /* СПИСКИ */
        .list { margin-top: 30px; overflow-y: auto; max-height: 60vh; }
        .item { padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* ПРОФИЛЬ */
        .big-circle {
            width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--neon);
            background: var(--glass); margin: 0 auto; display: flex; 
            justify-content: center; align-items: center; font-size: 50px; color: var(--neon);
            box-shadow: 0 0 30px rgba(160, 32, 240, 0.2); overflow: hidden; position: relative;
        }
        .big-circle img { width: 100%; height: 100%; object-fit: cover; }
        .section-title { text-align: center; color: var(--neon); letter-spacing: 5px; font-size: 14px; margin-bottom: 40px; }
    </style>
</head>
<body>

    <img id="bg-canvas" src="" alt="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="circle-btn" onclick="toggleScreen('library-screen')">☰</div>
        <div class="logo">cotakbass</div>
        <div style="display: flex; gap: 12px;">
            <div class="circle-btn" onclick="toggleScreen('profile-screen')">👤</div>
            <div class="circle-btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- ПЛЕЕР -->
    <div id="player-screen" class="active" style="padding: 110px 25px;">
        <div class="player-ui">
            <div id="display-title" class="t-title">Nightcrawler</div>
            <div id="display-author" class="t-author">Travis Scott</div>
            <div class="controls">
                <button class="circle-btn" onclick="prevTrack()">❮</button>
                <button class="circle-btn" style="border-color: var(--neon);" onclick="togglePlay()" id="play-trigger">▶</button>
                <button class="circle-btn" onclick="nextTrack()">❯</button>
            </div>
        </div>
    </div>

    <!-- ПОИСК -->
    <div id="search-screen" class="screen">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <span class="search-icon-inner">?</span>
        </div>
        <div class="list" id="search-results"></div>
    </div>

    <!-- БИБЛИОТЕКА -->
    <div id="library-screen" class="screen">
        <div class="section-title">favorites</div>
        <div class="list" id="favorites-list"></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile-screen" class="screen">
        <div class="big-circle" id="ava-clickable">
            <span id="plus-plus">+</span>
            <img id="ava-img" style="display:none">
        </div>
        <div class="section-title" style="margin-top:20px; opacity:0.6;">profile</div>
        
        <button class="circle-btn" style="width: auto; border-radius: 20px; padding: 0 20px; margin: 0 auto;" onclick="document.getElementById('track-up').click()">
            Добавить трек для теста
        </button>
    </div>

    <input type="file" id="ava-up" style="display:none" accept="image/*">
    <input type="file" id="track-up" style="display:none" accept="audio/mp3">

    <script>
        let currentScreen = 'player-screen';
        let isPlaying = false;
        let playlist = [
            {t: "Nightcrawler", a: "Travis Scott", s: "https://soundhelix.com"},
            {t: "Starboy", a: "The Weeknd", s: "https://soundhelix.com"}
        ];
        let currentIndex = 0;
        const audio = new Audio();

        // ТВОИ GIF (Вставь сюда ссылки на свои гифки)
        const gifs = [
            "https://giphy.com",
            "https://giphy.com"
        ];

        function toggleScreen(id) {
            if (currentScreen === id) {
                showMain();
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('player-screen').style.display = 'none';
                document.getElementById(id).classList.add('active');
                currentScreen = id;
            }
        }

        function showMain() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('player-screen').style.display = 'flex';
            currentScreen = 'player-screen';
        }

        function updateUI() {
            const track = playlist[currentIndex];
            document.getElementById('display-title').innerText = track.t;
            document.getElementById('display-author').innerText = track.a;
            // Рандомный GIF
            document.getElementById('bg-canvas').src = gifs[Math.floor(Math.random() * gifs.length)];
            audio.src = track.s;
            if(isPlaying) audio.play();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-trigger').innerText = isPlaying ? "Ⅱ" : "▶";
            if(isPlaying) audio.play(); else audio.pause();
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            updateUI();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            updateUI();
        }

        // Тестовая загрузка трека
        document.getElementById('track-up').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                const url = URL.createObjectURL(file);
                playlist.push({t: file.name.replace('.mp3',''), a: "Local User", s: url});
                alert("Трек добавлен в конец очереди!");
            }
        };

        // Аватарка
        document.getElementById('ava-clickable').onclick = () => document.getElementById('ava-up').click();
        document.getElementById('ava-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('ava-img').src = ev.target.result;
                document.getElementById('ava-img').style.display = 'block';
                document.getElementById('plus-plus').style.display = 'none';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        // Инициализация
        updateUI();
    </script>
</body>
</html>
