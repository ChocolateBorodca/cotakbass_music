<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* GIF ФОН ИЗ ТВОЕГО GITHUB */
        #bg-gif {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5;
            transition: opacity 1.5s ease;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 5000;
        }
        .logo-center {
            font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.3s cubic-bezier(0.15, 0, 0.2, 1);
        }
        .btn:active { transform: scale(0.9); box-shadow: 0 0 20px var(--neon); }

        /* ЭКРАНЫ */
        .screen {
            position: fixed; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.95); backdrop-filter: var(--blur); z-index: 4000;
        }
        .screen.active { display: flex; }

        /* ПЛЕЕР */
        .player-container {
            width: 100%; max-width: 500px; margin: 5vh auto 0;
            border-radius: 25px; overflow: hidden;
            background: var(--glass); border: 1px solid var(--border);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
        }

        /* ПРОФИЛЬ (КРУГ В ЦЕНТРЕ) */
        .profile-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--neon); background: var(--glass);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2);
            font-size: 50px; color: var(--neon); cursor: pointer; position: relative;
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .section-title { font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <!-- Левая кнопка ( Favorites ) -->
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <!-- Правые кнопки ( Profile | Search ) -->
            <div class="btn" id="nav-prof" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-container">
            <!-- ТВОЙ ПЛЕЕР ЯНДЕКСА -->
            <iframe frameborder="0" style="border:none;width:100%;height:550px;" width="100%" height="550" src="https://music.yandex.ru/iframe/album/36949141"></iframe>
        </div>
    </div>

    <!-- ФАВОРИТЫ -->
    <div id="lib-screen" class="screen">
        <div class="section-title">favorites</div>
        <div style="text-align: center; opacity: 0.5; margin-top: 50px;">Используйте плеер Яндекс для управления списком</div>
    </div>

    <!-- ПОИСК -->
    <div id="search-screen" class="screen">
        <div class="section-title">search</div>
        <div style="padding: 20px; background: var(--glass); border-radius: 20px; border: 1px solid var(--border); text-align: center;">
            <p>Вся мировая база доступна внутри плеера Яндекс.</p>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="prof-screen" class="screen">
        <div class="profile-container">
            <div class="profile-circle" id="prof-upload">
                <span id="plus">+</span>
                <img id="ava-img" style="display:none">
            </div>
        </div>
    </div>

    <input type="file" id="file-up" style="display:none" accept="image/*">

    <script>
        const USER = "ChocolateBorodca";
        const REPO = "cotakbass_music";

        let gifs = [];

        async function loadGifs() {
            try {
                const res = await fetch(`https://github.com{USER}/${REPO}/contents/bg`);
                if (res.ok) {
                    const data = await res.json();
                    gifs = data.filter(f => f.name.toLowerCase().endsWith('.gif')).map(f => f.download_url);
                    if(gifs.length > 0) changeBg();
                }
            } catch (e) {
                document.getElementById('bg-gif').src = "https://giphy.com";
            }
        }

        function changeBg() {
            if(gifs.length > 0) {
                document.getElementById('bg-gif').src = gifs[Math.floor(Math.random() * gifs.length)];
            }
        }

        let curScreen = 'player-screen';
        function toggleScreen(id) {
            const screen = document.getElementById(id);
            if (curScreen === id) {
                screen.classList.remove('active');
                curScreen = 'player-screen';
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
                curScreen = id;
            }
            changeBg();
        }

        document.getElementById('prof-upload').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById('ava-img');
                img.src = ev.target.result;
                img.style.display = 'block';
                document.getElementById('plus').style.display = 'none';
                document.getElementById('nav-prof').style.boxShadow = "0 0 15px #A020F0";
                document.getElementById('nav-prof').style.border = "2px solid #A020F0";
            };
            reader.readAsDataURL(e.target.files);
        };

        loadGifs();
    </script>
</body>
</html>
