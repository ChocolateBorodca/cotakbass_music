<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- Включаем модули Google Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "gstatic.com";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "gstatic.com";

        // ТВОИ КЛЮЧИ С ПОСЛЕДНЕГО СКРИНШОТА
        const firebaseConfig = {
            apiKey: "AIzaSyDwClEBJX6nIdLLn6Ht0kyCL21LNeoSvcI",
            authDomain: "firebaseapp.com",
            projectId: "cotakbass-music",
            storageBucket: "appspot.com",
            messagingSenderId: "73788041686",
            appId: "1:73788041686:web:a045fee5ccc166e1ce5c77"
        };

        // Запуск движка
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleModal = function() { document.getElementById('postModal').classList.toggle('active'); }

        // Загрузка ленты ссылок из дата-центра Google (в РФ летает без VPN)
        async function loadFeed() {
            const feed = document.getElementById('feed');
            try {
                const q = query(collection(db, "links"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                feed.innerHTML = "";
                
                if(querySnapshot.empty) {
                    feed.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:50px;'>лента пуста. поделись первым треком!</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    feed.innerHTML += `
                        <div class="card">
                            <span>shared by: ${item.user.toLowerCase()}</span>
                            <h3>${item.title.toLowerCase()}</h3>
                            <audio controls src="${item.url}"></audio>
                        </div>
                    `;
                });
            } catch(e) { feed.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:50px;'>ошибка подключения к облаку google.</p>"; }
        }

        // Загрузка текстовой ссылки напрямую в базу Google Firestore
        window.handleUpload = async function() {
            const title = document.getElementById('tTitle').value;
            const user = document.getElementById('uName').value;
            const url = document.getElementById('tUrl').value;

            if (!title || !user || !url) return alert("Заполни все поля!");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('upBtn').style.display = 'none';

            try {
                // Мгновенная запись ссылки в облачную базу
                await addDoc(collection(db, "links"), {
                    title: title,
                    user: user,
                    url: url.trim(),
                    createdAt: Date.now()
                });

                toggleModal();
                loadFeed();
                
                // Очистка
                document.getElementById('tTitle').value = "";
                document.getElementById('uName').value = "";
                document.getElementById('tUrl').value = "";
                document.getElementById('loader').style.display = 'none';
                document.getElementById('upBtn').style.display = 'block';
            } catch (err) {
                alert("Ошибка публикации: " + err.message);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('upBtn').style.display = 'block';
            }
        }

        loadFeed();
    </script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --blur: blur(45px); }
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; padding-bottom: 100px; overflow-x: hidden; }
        .overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7), #000); z-index: -1; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); backdrop-filter: var(--blur); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; backdrop-filter: var(--blur); }
        .card h3 { margin: 0 0 8px 0; font-size: 20px; font-weight: 800; }
        .card span { font-size: 10px; color: var(--neon); opacity: 0.7; letter-spacing: 2px; display: block; margin-bottom: 10px; }
        audio { width: 100%; height: 40px; border-radius: 12px; filter: invert(1) hue-rotate(180deg); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; cursor: pointer; z-index: 2000; border: none; font-weight: bold; }
        .modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; padding: 60px 25px; z-index: 3000; }
        .modal.active { display: flex; }
        input { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 18px; color: white; margin-bottom: 12px; outline: none; font-size: 16px; display: block; text-align: center; width: 100%; box-sizing: border-box; }
        .btn-post { background: var(--neon); color: white; padding: 20px; border-radius: 18px; text-align: center; font-weight: 800; cursor: pointer; border: none; font-size: 16px; margin-top: 10px; }
        #loader { display: none; text-align: center; margin-top: 20px; color: var(--neon); font-weight: 700; }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="nav"><div class="logo">cotakbass</div></div>
    <div class="container" id="feed"><p style="text-align:center; opacity:0.3; margin-top:50px;">подключение к облаку google...</p></div>
    <button class="fab" onclick="toggleModal()">+</button>

    <div class="modal" id="postModal">
        <h2 style="text-align: center; margin-bottom: 30px;">Поделиться треком</h2>
        <input type="text" id="tTitle" placeholder="Название трека">
        <input type="text" id="uName" placeholder="Твой ник">
        <input type="text" id="tUrl" placeholder="Прямая ссылка на MP3 файл">
        <button class="btn-post" id="upBtn" onclick="handleUpload()">Опубликовать</button>
        <div id="loader">ТРЕК ДОБАВЛЯЕТСЯ В ЛЕНТУ...</div>
        <p onclick="toggleModal()" style="text-align: center; margin-top: 30px; opacity: 0.4; cursor: pointer;">Отмена</p>
    </div>

</body>
</html>
