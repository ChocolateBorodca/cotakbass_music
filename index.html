<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <!-- Подключаем API SoundCloud -->
    <script src="https://soundcloud.com"></script>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* GIF ФОН */
        #bg-gif {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5; transition: opacity 1.5s ease;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 2000;
        }
        .logo-center {
            font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.4s cubic-bezier(0.15, 0, 0.2, 1);
        }
        .btn:active { transform: scale(0.9); box-shadow: 0 0 20px var(--neon); }

        /* ЭКРАНЫ */
        .screen {
            position: absolute; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.95); backdrop-filter: var(--blur); z-index: 1000;
        }
        .screen.active { display: flex; }

        /* ПЛЕЕР */
        .player-content { text-align: left; margin-top: 15vh; padding-left: 5%; }
        .track-title { font-size: 42px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 8px; min-height: 100px; }
        .track-author { font-size: 18px; color: var(--neon); font-weight: 300; margin-bottom: 60px; opacity: 0.8; }
        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 65px; height: 65px; font-size: 24px; }

        #sc-player { position: absolute; top: -5000px; visibility: hidden; }

        /* ПОИСК */
        .search-box {
            width: 100%; background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px 20px; box-sizing: border-box;
            display: flex; align-items: center; position: relative;
        }
        .search-box input { background: none; border: none; color: white; width: 85%; font-size: 18px; outline: none; }

        /* СПИСКИ */
        .list { margin-top: 20px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* ПРОФИЛЬ */
        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--neon); background: var(--glass);
            margin: 15vh auto 0; display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2); position: relative;
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="nav-prof" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- ВИДЖЕТ С ТВОИМ ID -->
    <iframe id="sc-player" src="https://soundcloud.com"></iframe>

    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-content">
            <div id="track-title" class="track-title">Загрузка...</div>
            <div id="track-author" class="track-author">cotakbass music</div>
            <div class="controls">
                <div class="btn" onclick="prev()">❮</div>
                <div class="btn" id="play-btn" style="border-color: var(--neon)" onclick="playPause()">▶</div>
                <div class="btn" onclick="next()">❯</div>
            </div>
        </div>
    </div>

    <div id="lib-screen" class="screen">
        <div style="text-align:center; color:var(--neon); letter-spacing:5px; font-size:11px; margin-bottom:30px;">FAVORITES</div>
        <div class="list" id="fav-list"></div>
    </div>

    <div id="search-screen" class="screen">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <div style="color:var(--neon); font-weight:900; font-size:22px;">?</div>
        </div>
        <div class="list" id="search-list"></div>
    </div>

    <div id="prof-screen" class="screen">
        <div class="profile-circle" id="prof-upload">
            <span id="plus" style="font-size:50px; color:var(--neon);">+</span>
            <img id="ava-img" style="display:none">
        </div>
    </div>

    <input type="file" id="file-up" style="display:none" accept="image/*">

    <script>
        const USER = "ChocolateBorodca";
        const REPO = "cotakbass_music";

        const widget = SC.Widget(document.getElementById('sc-player'));
        let tracks = [], gifs = [], isPlaying = false, curScreen = 'player-screen';

        async function loadGifs() {
            try {
                const res = await fetch(`https://github.com{USER}/${REPO}/contents/bg`);
                const data = await res.json();
                gifs = data.filter(f => f.name.endsWith('.gif')).map(f => f.download_url);
                if(gifs.length > 0) changeBg();
            } catch (e) { console.log("Gifs missing"); }
        }

        function changeBg() {
            if(gifs.length > 0) document.getElementById('bg-gif').src = gifs[Math.floor(Math.random()*gifs.length)];
        }

        // Ждем готовности виджета
        widget.bind(SC.Widget.Events.READY, () => {
            console.log("SoundCloud Ready");
            widget.getSounds((sounds) => {
                tracks = sounds;
                if (tracks.length > 0) {
                    updateUI();
                    renderLists();
                } else {
                    document.getElementById('track-title').innerText = "Ошибка ID";
                    document.getElementById('track-author').innerText = "Плейлист пуст или скрыт";
                }
            });
        });

        function updateUI() {
            widget.getCurrentSound((s) => {
                if (s) {
                    document.getElementById('track-title').innerText = s.title;
                    document.getElementById('track-author').innerText = s.user.username;
                    changeBg();
                }
            });
        }

        function playPause() {
            widget.toggle();
            widget.isPaused((paused) => {
                isPlaying = !paused;
                document.getElementById('play-btn').innerText = isPlaying ? "Ⅱ" : "▶";
            });
        }

        function next() { widget.next(); isPlaying = true; document.getElementById('play-btn').innerText = "Ⅱ"; setTimeout(updateUI, 1000); }
        function prev() { widget.prev(); isPlaying = true; document.getElementById('play-btn').innerText = "Ⅱ"; setTimeout(updateUI, 1000); }

        function toggleScreen(id) {
            const screen = document.getElementById(id);
            if (curScreen === id) {
                screen.classList.remove('active');
                curScreen = 'player-screen';
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
                curScreen = id;
            }
        }

        function renderLists() {
            const fList = document.getElementById('fav-list');
            fList.innerHTML = "";
            tracks.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.title}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { widget.skip(i); widget.play(); isPlaying = true; document.getElementById('play-btn').innerText = "Ⅱ"; updateUI(); toggleScreen('lib-screen'); };
                fList.appendChild(div);
            });
        }

        document.getElementById('search-input').oninput = (e) => {
            const v = e.target.value.toLowerCase();
            const list = document.getElementById('search-list');
            list.innerHTML = "";
            if(v.length < 1) return;
            tracks.filter(t => t.title.toLowerCase().includes(v)).forEach(t => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.title}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { 
                    const idx = tracks.indexOf(t);
                    widget.skip(idx); widget.play(); isPlaying = true; 
                    document.getElementById('play-btn').innerText = "Ⅱ"; updateUI(); 
                    toggleScreen('search-screen'); 
                };
                list.appendChild(div);
            });
        };

        document.getElementById('prof-upload').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('ava-img').src = ev.target.result; document.getElementById('ava-img').style.display = 'block';
                document.getElementById('plus').style.display = 'none';
                document.getElementById('nav-prof').style.boxShadow = "0 0 15px #A020F0";
                document.getElementById('nav-prof').style.border = "2px solid #A020F0";
            };
            reader.readAsDataURL(e.target.files);
        };

        loadGifs();
    </script>
</body>
</html>
