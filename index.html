<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cotakbass music</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Название слева */
        .header {
            padding: 30px 5%;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        /* Кнопка выхода слева сверху */
        .exit-btn {
            position: fixed;
            top: 25px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(160, 32, 240, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            color: #A020F0;
            font-size: 20px;
            transition: 0.3s;
        }

        /* Центрирование круга */
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .profile-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid #A020F0;
            background: rgba(160, 32, 240, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #A020F0;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(160, 32, 240, 0.2);
            overflow: hidden;
            position: relative;
        }

        .profile-circle:active {
            transform: scale(0.95);
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Скрытый инпут для выбора фото */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="exit-btn" onclick="window.location.href='#'">←</div>

    <div class="header">cotakbass</div>

    <div class="main-container">
        <!-- Клик по этому кругу откроет галерею -->
        <div class="profile-circle" id="circle">
            <span id="plus-icon">+</span>
            <img id="preview" style="display:none;">
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <script>
        const circle = document.getElementById('circle');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const plusIcon = document.getElementById('plus-icon');

        // При клике на круг открываем выбор файла
        circle.addEventListener('click', () => {
            fileInput.click();
        });

        // Показываем фото сразу после выбора
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    plusIcon.style.display = 'none';
                    circle.style.border = '2px solid #A020F0';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
