<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- ПОДКЛЮЧАЕМ СВОЙ ФАЙЛ, КОТОРЫЙ ТЫ ТОЛЬКО ЧТО СОЗДАЛ -->
    <script src="supabase.js"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: #000; color: white; font-family: sans-serif; padding-bottom: 100px; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); text-align: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        audio { width: 100%; height: 35px; margin-top: 10px; filter: invert(1); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; cursor: pointer; border: none; z-index: 5000; }
        .modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; padding: 40px 25px; z-index: 6000; }
        .modal.active { display: flex; }
        input { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; width: 100%; box-sizing: border-box; }
        .btn-post { background: var(--neon); color: white; padding: 18px; border-radius: 12px; text-align: center; font-weight: 800; cursor: pointer; border: none; width: 100%; }
        #loader { display: none; text-align: center; color: var(--neon); padding: 20px; font-weight: bold; }
        .file-label { display: block; background: #222; border: 1px dashed #444; padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 15px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="nav"><div class="logo">cotakbass</div></div>
    <div class="container" id="feed"></div>
    <button class="fab" onclick="openModal()">+</button>

    <div class="modal" id="modal">
        <h2 style="text-align:center">опубликовать</h2>
        <input type="text" id="tTitle" placeholder="название трека">
        <input type="text" id="uName" placeholder="твой ник">
        <label class="file-label" for="fInp" id="fStatus">ВЫБРАТЬ MP3 ФАЙЛ</label>
        <input type="file" id="fInp" accept="audio/*" style="display:none">
        <button class="btn-post" id="upBtn" onclick="handleSend()">Опубликовать</button>
        <div id="loader">ТРЕК ЛЕТИТ В ОБЛАКО...</div>
        <p onclick="closeModal()" style="text-align:center; opacity:0.4; margin-top:20px; cursor:pointer">отмена</p>
    </div>

    <script>
        const S_URL = "https://supabase.co";
        const S_KEY = "sb_publishable_YnpxQyq_9cv80tgAYgOjg_u6eYV1rCq2R4x-8IqSNCG-rLh-N68f_L5QJz6nQY_2S5U4v5p_Vv";
        let sb = null;

        function init() {
            if (typeof supabase !== 'undefined') {
                sb = supabase.createClient(S_URL, S_KEY);
                loadFeed();
            } else {
                alert("Библиотека все еще не загружена. Проверь наличие файла supabase.js на GitHub!");
            }
        }

        function openModal() { document.getElementById('modal').classList.add('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        document.getElementById('fInp').onchange = function() {
            if(this.files[0]) document.getElementById('fStatus').innerText = "ВЫБРАН: " + this.files[0].name;
        };

        async function loadFeed() {
            try {
                const { data } = await sb.from('posts').select('*').order('id', { ascending: false });
                if (data) {
                    const feed = document.getElementById('feed');
                    feed.innerHTML = "";
                    data.forEach(item => {
                        feed.innerHTML += `<div class="card"><small style="color:var(--neon)">By: ${item.author}</small><h3>${item.title}</h3><audio controls src="${item.link}"></audio></div>`;
                    });
                }
            } catch (e) { console.log("Feed load failed"); }
        }

        async function handleSend() {
            const t = document.getElementById('tTitle').value;
            const u = document.getElementById('uName').value;
            const f = document.getElementById('fInp').files[0];

            if (!t || !u || !f) return alert("Заполни всё и выбери файл!");
            if (!sb) return alert("База не инициализирована!");

            document.getElementById('upBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                const fName = Date.now() + ".mp3";
                // Загрузка
                const { error: upErr } = await sb.storage.from('music').upload(fName, f);
                if (upErr) throw upErr;

                // Получение URL
                const { data: { publicUrl } } = sb.storage.from('music').getPublicUrl(fName);
                
                // Запись в базу
                const { error: dbErr } = await sb.from('posts').insert([{ title: t, author: u, link: publicUrl }]);
                if (dbErr) throw dbErr;

                location.reload();
            } catch (err) {
                alert("Ошибка: " + err.message);
                document.getElementById('upBtn').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            }
        }

        setTimeout(init, 500);
    </script>
</body>
</html>
