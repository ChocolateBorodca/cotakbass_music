<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music | Global</title>
    <!-- Подключаем API YouTube -->
    <script src="https://youtube.com"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --border: rgba(160, 32, 240, 0.3); --blur: blur(45px); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
        
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.4; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 2000; }
        .logo-center { font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 15px var(--neon); text-transform: lowercase; position: absolute; left: 50%; transform: translateX(-50%); }

        .btn { width: 52px; height: 52px; border-radius: 50%; background: var(--glass); backdrop-filter: var(--blur); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: 0.3s; }
        
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: 110px 25px 25px; background: rgba(0,0,0,0.9); backdrop-filter: var(--blur); z-index: 1000; }
        .screen.active { display: flex; }

        .player-content { text-align: left; margin-top: 15vh; padding-left: 5%; }
        .track-title { font-size: 40px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 8px; height: 90px; overflow: hidden; }
        .track-author { font-size: 18px; color: var(--neon); font-weight: 300; margin-bottom: 50px; opacity: 0.8; }
        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 65px; height: 65px; font-size: 24px; }

        /* СКРЫТЫЙ ПЛЕЕР (ДВИЖОК) */
        #yt-player { position: absolute; top: -5000px; left: -5000px; }

        .search-box { width: 100%; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 15px 20px; display: flex; align-items: center; }
        .search-box input { background: none; border: none; color: white; width: 85%; font-size: 18px; outline: none; }

        .list { margin-top: 20px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        .profile-circle { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--neon); background: var(--glass); margin: 15vh auto 0; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2); }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- YouTube Двигатель -->
    <div id="yt-player"></div>

    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-content">
            <div id="display-title" class="track-title">Мировая база</div>
            <div id="display-author" class="track-author">Готова к поиску</div>
            <div class="controls">
                <div class="btn" onclick="prev()">❮</div>
                <div class="btn" id="play-btn" style="border-color: var(--neon)" onclick="playPause()">▶</div>
                <div class="btn" onclick="next()">❯</div>
            </div>
        </div>
    </div>

    <div id="search-screen" class="screen">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <div style="color:var(--neon); font-weight:900; font-size:22px;">?</div>
        </div>
        <div class="list" id="search-list"></div>
    </div>

    <!-- Другие экраны (Favorites, Profile) -->
    <div id="lib-screen" class="screen"><div class="logo-center" style="position:static; transform:none; text-align:center;">favorites</div><div class="list"></div></div>
    <div id="prof-screen" class="screen"><div class="profile-circle">+</div></div>

    <script>
        let player, isPlaying = false, tracks = [], curIdx = 0;

        // Инициализация YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) next();
        }

        async function searchMusic(query) {
            // Используем публичный сервис для поиска по YouTube (без ключей API)
            const res = await fetch(`https://kavin.rocks{encodeURIComponent(query)}&filter=music_videos`);
            const data = await res.json();
            
            const list = document.getElementById('search-list');
            list.innerHTML = "";
            
            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div><b>${item.title}</b><br><small>${item.uploaderName}</small></div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => playTrack(item.url.split('=')[1], item.title, item.uploaderName);
                list.appendChild(div);
            });
        }

        function playTrack(id, title, author) {
            player.loadVideoById(id);
            document.getElementById('display-title').innerText = title;
            document.getElementById('display-author').innerText = author;
            document.getElementById('play-btn').innerText = "Ⅱ";
            isPlaying = true;
            document.getElementById('search-screen').classList.remove('active');
        }

        function playPause() {
            if(!player) return;
            if(isPlaying) { player.pauseVideo(); document.getElementById('play-btn').innerText = "▶"; }
            else { player.playVideo(); document.getElementById('play-btn').innerText = "Ⅱ"; }
            isPlaying = !isPlaying;
        }

        function toggleScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('search-input').oninput = (e) => {
            if(e.target.value.length > 2) searchMusic(e.target.value);
        };
    </script>
</body>
</html>
