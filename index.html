<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- Подключаем библиотеку через «пробивной» CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: #000; color: white; font-family: sans-serif; padding-bottom: 100px; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); text-align: center; background: #000; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; }
        audio { width: 100%; height: 35px; margin-top: 10px; filter: invert(1); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; cursor: pointer; border: none; z-index: 2000; }
        .modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; padding: 60px 25px; z-index: 3000; }
        .modal.active { display: flex; }
        input, .file-label { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 18px; color: white; margin-bottom: 12px; outline: none; width: 100%; box-sizing: border-box; text-align: center; display: block; cursor: pointer; }
        .btn-post { background: var(--neon); color: white; padding: 20px; border-radius: 18px; text-align: center; font-weight: 800; cursor: pointer; border: none; }
        .btn-post:disabled { background: #222; color: #555; }
    </style>
</head>
<body>

    <div class="nav"><div class="logo">cotakbass</div></div>
    <div class="container" id="feed"></div>
    <button class="fab" onclick="document.getElementById('m').classList.add('active')">+</button>

    <div class="modal" id="m">
        <h2 style="text-align: center;">Публикация</h2>
        <input type="text" id="t" placeholder="Название">
        <input type="text" id="u" placeholder="Ник">
        <label class="file-label" for="f" id="fs">ВЫБРАТЬ MP3</label>
        <input type="file" id="f" accept="audio/mpeg" style="display: none;" onchange="if(this.files[0]) document.getElementById('fs').innerText='Файл: '+this.files[0].name">
        <button class="btn-post" id="b" onclick="upload()" disabled>ЖДЕМ БАЗУ...</button>
        <p onclick="document.getElementById('m').classList.remove('active')" style="text-align: center; margin-top: 30px; opacity: 0.4;">Отмена</p>
    </div>

    <script>
        const S_URL = "https://supabase.co";
        const S_KEY = "sb_publishable_YnpxQyq_9cv80tgAYgOjg_u6eYV1rCq2R4x-8IqSNCG-rLh-N68f_L5QJz6nQY_2S5U4v5p_Vv";
        let sb;

        // Ждем загрузки библиотеки Supabase
        const check = setInterval(() => {
            if (window.supabase) {
                sb = window.supabase.createClient(S_URL, S_KEY);
                document.getElementById('b').innerText = "ОПУБЛИКОВАТЬ";
                document.getElementById('b').disabled = false;
                load();
                clearInterval(check);
            }
        }, 1000);

        async function load() {
            const { data, error } = await sb.from('posts').select('*').order('id', { ascending: false });
            if (data) {
                const feed = document.getElementById('feed');
                feed.innerHTML = "";
                data.forEach(item => {
                    feed.innerHTML += `<div class="card"><span>By: ${item.author}</span><h3>${item.title}</h3><audio controls src="${item.link}"></audio></div>`;
                });
            }
        }

        async function upload() {
            const t = document.getElementById('t').value;
            const u = document.getElementById('u').value;
            const file = document.getElementById('f').files[0];

            if (!t || !u || !file) return alert("Заполни всё!");

            document.getElementById('b').innerText = "ЗАГРУЗКА...";
            document.getElementById('b').disabled = true;

            try {
                const name = `${Date.now()}_${file.name}`;
                
                // 1. Загрузка файла через официальный метод (самый надежный)
                const { data: upData, error: upErr } = await sb.storage.from('music').upload(name, file);
                if (upErr) throw upErr;

                // 2. Ссылка
                const { data: { publicUrl } } = sb.storage.from('music').getPublicUrl(name);

                // 3. Запись в таблицу
                const { error: dbErr } = await sb.from('posts').insert([{ title: t, author: u, link: publicUrl }]);
                if (dbErr) throw dbErr;

                location.reload();
            } catch (err) {
                alert("Ошибка: " + (err.error_description || err.message || "Неизвестная ошибка"));
                document.getElementById('b').innerText = "ПОПРОБОВАТЬ СНОВА";
                document.getElementById('b').disabled = false;
            }
        }
    </script>
</body>
</html>
