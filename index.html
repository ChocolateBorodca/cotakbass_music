<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cotakbass music</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; overflow: hidden;
        }

        /* Навигация */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; position: fixed; width: 90%; top: 0; z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; }

        .nav-right { display: flex; gap: 15px; }

        .circle-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(160, 32, 240, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #A020F0; font-size: 20px; transition: 0.3s;
        }

        /* Экраны */
        .screen {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            background: #000;
        }

        .screen.active { display: flex; }

        /* ПЛЕЕР */
        .player-content { width: 90%; text-align: left; padding-left: 5%; }
        .track-title { font-size: 48px; font-weight: 800; margin-bottom: 5px; }
        .track-author { font-size: 18px; color: #A020F0; opacity: 0.8; margin-bottom: 50px; }

        .controls { display: flex; gap: 20px; align-items: center; }
        .play-btn { width: 70px; height: 70px; font-size: 30px; border: 1px solid #A020F0; box-shadow: 0 0 15px rgba(160, 32, 240, 0.3); }

        /* ПРОФИЛЬ */
        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid #A020F0; background: rgba(160, 32, 240, 0.05);
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; color: #A020F0; cursor: pointer;
            box-shadow: 0 0 30px rgba(160, 32, 240, 0.2); overflow: hidden;
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }

        .back-btn { position: fixed; top: 25px; left: 20px; z-index: 200; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- ПЛЕЕР -->
    <div id="player-screen" class="screen active">
        <div class="nav">
            <div class="logo">cotakbass</div>
            <div class="nav-right">
                <div class="circle-btn" onclick="showScreen('profile-screen')">👤</div>
                <div class="circle-btn">?</div>
            </div>
        </div>
        
        <div class="player-content">
            <div class="track-title">Music Track</div>
            <div class="track-author">Artist Name</div>
            <div class="controls">
                <button class="circle-btn">❮</button>
                <button class="circle-btn play-btn">▶</button>
                <button class="circle-btn">❯</button>
            </div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile-screen" class="screen">
        <div class="circle-btn back-btn" onclick="showScreen('player-screen')">←</div>
        
        <div class="profile-circle" id="circle">
            <span id="plus-icon">+</span>
            <img id="preview" style="display:none;">
        </div>
        <p style="margin-top:20px; opacity:0.5; letter-spacing:3px; font-size:12px;">PROFILE</p>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <script>
        // Функция переключения экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        const circle = document.getElementById('circle');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const plusIcon = document.getElementById('plus-icon');

        circle.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    plusIcon.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
