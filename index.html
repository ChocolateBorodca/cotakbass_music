<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- ПОДКЛЮЧАЕМ ЧЕРЕЗ ОБЛАКО CLOUDFLARE (Обычно не блокируется) -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --blur: blur(45px); }
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; padding-bottom: 100px; }
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.3; }
        .overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7), #000); z-index: -1; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); backdrop-filter: var(--blur); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; backdrop-filter: var(--blur); }
        audio { width: 100%; height: 40px; border-radius: 12px; filter: invert(1) hue-rotate(180deg); }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; cursor: pointer; z-index: 2000; border: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; padding: 60px 25px; z-index: 3000; backdrop-filter: blur(20px); }
        .modal.active { display: flex; }
        input, .file-label { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 18px; color: white; margin-bottom: 12px; outline: none; font-size: 16px; display: block; text-align: center; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn-post { background: var(--neon); color: white; padding: 20px; border-radius: 18px; text-align: center; font-weight: 800; cursor: pointer; border: none; font-size: 16px; }
        .btn-post:disabled { background: #222; color: #555; }
        #loader { display: none; text-align: center; margin-top: 20px; color: var(--neon); font-weight: 700; }
    </style>
</head>
<body>
    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>
    <div class="nav"><div class="logo">cotakbass</div></div>
    <div class="container" id="feed"><p style="text-align:center; opacity:0.3; margin-top:50px;">подключение...</p></div>
    <button class="fab" onclick="toggleModal()">+</button>

    <div class="modal" id="postModal">
        <h2 style="text-align: center; margin-bottom: 30px;">Опубликовать</h2>
        <input type="text" id="trackTitle" placeholder="Название трека">
        <input type="text" id="userName" placeholder="Твой ник">
        <label class="file-label" for="fileInput" id="fileStatus">Выбрать MP3</label>
        <input type="file" id="fileInput" accept="audio/mpeg" style="display: none;" onchange="if(this.files) document.getElementById('fileStatus').innerText='Файл готов'">
        <button class="btn-post" id="upBtn" onclick="handleUpload()" disabled>ПОДКЛЮЧЕНИЕ К БАЗЕ...</button>
        <div id="loader">ТРЕК ЛЕТИТ В ОБЛАКО...</div>
        <p onclick="toggleModal()" style="text-align: center; margin-top: 30px; opacity: 0.4; cursor: pointer;">Отмена</p>
    </div>

    <script>
        const S_URL = "https://supabase.co";
        const S_KEY = "sb_publishable_YnpxQyq_9cv80tgAYgOjg_u6eYV1rCq2R4x-8IqSNCG-rLh-N68f_L5QJz6nQY_2S5U4v5p_Vv"; 
        let sb = null;

        // ПРОВЕРКА ЗАГРУЗКИ БИБЛИОТЕКИ
        const check = setInterval(() => {
            if (window.supabase) {
                sb = window.supabase.createClient(S_URL, S_KEY);
                document.getElementById('upBtn').innerText = "Опубликовать";
                document.getElementById('upBtn').disabled = false;
                loadFeed();
                clearInterval(check);
            }
        }, 1000);

        function toggleModal() { document.getElementById('postModal').classList.toggle('active'); }

        async function loadFeed() {
            const { data } = await sb.from('posts').select('*').order('id', { ascending: false });
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            if (data) {
                data.forEach(item => {
                    feed.innerHTML += `<div class="card"><span style="font-size:10px; color:var(--neon)">By: ${item.author}</span><h3>${item.title}</h3><audio controls src="${item.link}"></audio></div>`;
                });
            }
        }

        async function handleUpload() {
            const title = document.getElementById('trackTitle').value;
            const user = document.getElementById('userName').value;
            const file = document.getElementById('fileInput').files;

            if (!title || !user || !file) return alert("Заполни поля!");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('upBtn').style.display = 'none';

            try {
                const fName = Date.now() + ".mp3";
                const { error: upErr } = await sb.storage.from('music').upload(fName, file);
                if (upErr) throw upErr;
                const { data: { publicUrl } } = sb.storage.from('music').getPublicUrl(fName);
                await sb.from('posts').insert([{ title: title, author: user, link: publicUrl }]);
                location.reload();
            } catch (err) {
                alert("Ошибка: " + err.message);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('upBtn').style.display = 'block';
            }
        }
    </script>
</body>
</html>
