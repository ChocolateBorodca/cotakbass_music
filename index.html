<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <!-- Подключаем Supabase SDK -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --blur: blur(45px); }
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; padding-bottom: 100px; }
        
        /* Фон */
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.3; }
        .overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7), #000); z-index: -1; }

        /* Навигация */
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); backdrop-filter: var(--blur); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-transform: lowercase; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        /* Карточка трека */
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; backdrop-filter: var(--blur); animation: fadeIn 0.5s ease forwards; }
        .card h3 { margin: 0 0 8px 0; font-size: 22px; font-weight: 800; letter-spacing: -1px; }
        .card .user-tag { font-size: 11px; color: var(--neon); opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: block; }
        
        audio { width: 100%; height: 35px; border-radius: 10px; filter: invert(1) hue-rotate(180deg); }

        /* Кнопка + */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 60px; border-radius: 20px; background: var(--neon); display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; cursor: pointer; box-shadow: 0 0 30px rgba(160, 32, 240, 0.4); z-index: 2000; border: none; font-weight: 800; }

        /* Модальное окно */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: none; flex-direction: column; padding: 60px 25px; z-index: 3000; backdrop-filter: blur(20px); }
        .modal.active { display: flex; }
        .modal h2 { margin-bottom: 40px; text-align: center; letter-spacing: -1px; }
        
        input { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 18px; color: white; margin-bottom: 15px; outline: none; font-size: 16px; }
        input:focus { border-color: var(--neon); }
        
        .btn-post { background: var(--neon); color: white; padding: 20px; border-radius: 18px; text-align: center; font-weight: 800; cursor: pointer; border: none; font-size: 16px; margin-top: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>

    <div class="nav"><div class="logo">cotakbass</div></div>

    <div class="container" id="feed">
        <p style="text-align: center; opacity: 0.3; margin-top: 50px;">загрузка треков...</p>
    </div>

    <button class="fab" onclick="toggleModal()">+</button>

    <div class="modal" id="postModal">
        <h2>Опубликовать</h2>
        <input type="text" id="trackTitle" placeholder="Название трека">
        <input type="text" id="userName" placeholder="Твой ник">
        <input type="text" id="trackUrl" placeholder="Прямая ссылка на MP3">
        <button class="btn-post" onclick="postTrack()">Разместить трек</button>
        <p onclick="toggleModal()" style="text-align: center; margin-top: 30px; opacity: 0.4; cursor: pointer;">Отмена</p>
    </div>

    <script>
        // Твои данные из Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_YnpxQyq_9cv80tgAYgOjg_u6eYV1rCq2R4x-8IqSNCG-rLh-N68f_L5QJz6nQY_2S5U4v5p_Vv"; // anon key
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleModal() {
            document.getElementById('postModal').classList.toggle('active');
        }

        // Загрузка ленты
        async function loadFeed() {
            const { data, error } = await _supabase.from('posts').select('*').order('id', { ascending: false });
            if (error) return console.error(error);

            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            
            if (data.length === 0) {
                feed.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:50px;">Здесь пока пусто. Будь первым!</p>';
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="user-tag">Upload by: ${item.author}</span>
                    <h3>${item.title}</h3>
                    <audio controls src="${item.link}"></audio>
                `;
                feed.appendChild(card);
            });
        }

        // Публикация
        async function postTrack() {
            const title = document.getElementById('trackTitle').value;
            const author = document.getElementById('userName').value;
            const link = document.getElementById('trackUrl').value;

            if (!title || !author || !link) return alert("Заполни все поля!");

            const { error } = await _supabase.from('posts').insert([{ title, author, link }]);

            if (error) {
                alert("Ошибка: убедись, что RLS в Supabase выключен для таблицы posts.");
                console.error(error);
            } else {
                toggleModal();
                loadFeed();
                // Очистка полей
                document.getElementById('trackTitle').value = "";
                document.getElementById('userName').value = "";
                document.getElementById('trackUrl').value = "";
            }
        }

        loadFeed();
    </script>
</body>
</html>
