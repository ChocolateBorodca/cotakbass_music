<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        #bg-gif {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5;
            transition: opacity 1.5s ease-in-out;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 1000;
        }
        .logo {
            font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen {
            position: absolute; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); z-index: 500;
        }
        .screen.active { display: flex; }

        .player-content { text-align: left; margin-top: 15vh; padding-left: 5%; }
        .track-title { font-size: 42px; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-bottom: 10px; }
        .track-author { font-size: 18px; color: var(--neon); font-weight: 300; margin-bottom: 60px; }
        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 65px; height: 65px; font-size: 24px; }

        .search-box {
            position: relative; width: 100%; background: var(--glass); 
            backdrop-filter: var(--blur); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px 20px; display: flex; align-items: center; box-sizing: border-box;
        }
        .search-box input { background: none; border: none; color: white; width: 100%; font-size: 18px; outline: none; }
        .list { margin-top: 20px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--neon); background: var(--glass);
            margin: 15vh auto 0; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2);
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-content">
            <div id="track-title" class="track-title">Загрузка...</div>
            <div id="track-author" class="track-author" style="color: var(--neon)">подожди чуть-чуть</div>
            <div class="controls">
                <div class="btn" onclick="prev()">❮</div>
                <div class="btn" id="play-btn" style="border-color: var(--neon)" onclick="playPause()">▶</div>
                <div class="btn" onclick="next()">❯</div>
            </div>
        </div>
    </div>

    <div id="lib-screen" class="screen">
        <div class="btn" style="position:fixed; top:25px; left:25px;" onclick="toggleScreen('lib-screen')">←</div>
        <div class="logo" style="position: static; margin-bottom: 30px; text-align: center;">favorites</div>
        <div class="list" id="fav-list"></div>
    </div>

    <div id="search-screen" class="screen">
        <div class="btn" style="position:fixed; top:25px; left:25px;" onclick="toggleScreen('search-screen')">←</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <div style="color:var(--neon); font-weight:900; margin-left:10px;">?</div>
        </div>
        <div class="list" id="search-list"></div>
    </div>

    <div id="prof-screen" class="screen">
        <div class="btn" style="position:fixed; top:25px; left:25px;" onclick="toggleScreen('prof-screen')">←</div>
        <div class="profile-circle" id="prof-btn">
            <span id="plus">+</span>
            <img id="ava-img" style="display:none">
        </div>
        <input type="file" id="file-up" style="display:none" accept="image/*">
    </div>

    <script>
        // ДАННЫЕ (ПРОВЕРЬ ЕЩЕ РАЗ)
        const USER = "ChocolateBorodca"; 
        const REPO = "cotakbass_music"; 

        let tracks = [], gifs = [], curIdx = 0, isPlaying = false, curScreen = 'player-screen';
        const audio = new Audio();

        async function init() {
            const statusTitle = document.getElementById('track-title');
            const statusAuthor = document.getElementById('track-author');

            try {
                // 1. Пытаемся получить музыку
                const mRes = await fetch(`https://github.com{USER}/${REPO}/contents/music?t=${Date.now()}`);
                if (!mRes.ok) {
                    statusTitle.innerText = "Папка не найдена";
                    statusAuthor.innerText = "Создай папку music на GitHub";
                    return;
                }
                const mData = await mRes.json();
                
                // Фильтруем только mp3
                tracks = mData.filter(f => f.name.toLowerCase().endsWith('.mp3')).map(f => ({
                    name: f.name.replace('.mp3', ''),
                    url: f.download_url
                }));

                if (tracks.length === 0) {
                    statusTitle.innerText = "Папка пуста";
                    statusAuthor.innerText = "Закинь MP3 в папку music";
                    return;
                }

                // 2. Пытаемся получить гифки
                const bRes = await fetch(`https://github.com{USER}/${REPO}/contents/bg?t=${Date.now()}`);
                if (bRes.ok) {
                    const bData = await bRes.json();
                    gifs = bData.filter(f => f.name.toLowerCase().endsWith('.gif')).map(f => f.download_url);
                }

                // 3. Если всё ок - запускаем
                update();
                renderLibrary();

            } catch (e) {
                statusTitle.innerText = "Ошибка сети";
                statusAuthor.innerText = "Проверь интернет или Public статус";
                console.error(e);
            }
        }

        function toggleScreen(id) {
            const screen = document.getElementById(id);
            if (curScreen === id) {
                screen.classList.remove('active');
                curScreen = 'player-screen';
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
                curScreen = id;
            }
        }

        function update() {
            if(tracks.length === 0) return;
            const t = tracks[curIdx];
            const parts = t.name.split(' - ');
            document.getElementById('track-title').innerText = parts[1] || parts[0];
            document.getElementById('track-author').innerText = parts[0] || "Unknown";
            
            if(gifs.length > 0) {
                document.getElementById('bg-gif').src = gifs[Math.floor(Math.random() * gifs.length)];
            }
            audio.src = t.url;
            if(isPlaying) audio.play();
        }

        function renderLibrary() {
            const list = document.getElementById('fav-list');
            list.innerHTML = "";
            tracks.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.name}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { curIdx = i; isPlaying = true; document.getElementById('play-btn').innerText = "Ⅱ"; update(); toggleScreen('lib-screen'); };
                list.appendChild(div);
            });
        }

        function playPause() {
            if(tracks.length === 0) return;
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerText = isPlaying ? "Ⅱ" : "▶";
            isPlaying ? audio.play() : audio.pause();
        }

        function next() { if(tracks.length > 0) { curIdx = (curIdx + 1) % tracks.length; update(); } }
        function prev() { if(tracks.length > 0) { curIdx = (curIdx - 1 + tracks.length) % tracks.length; update(); } }

        document.getElementById('search-input').oninput = (e) => {
            const v = e.target.value.toLowerCase();
            const list = document.getElementById('search-list');
            list.innerHTML = "";
            if(v.length < 1) return;
            tracks.filter(t => t.name.toLowerCase().includes(v)).forEach(t => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.name}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { curIdx = tracks.indexOf(t); isPlaying = true; update(); toggleScreen('search-screen'); };
                list.appendChild(div);
            });
        };

        document.getElementById('prof-btn').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById('ava-img');
                img.src = ev.target.result;
                img.style.display = 'block';
                document.getElementById('plus').style.display = 'none';
            };
            reader.readAsDataURL(e.target.files);
        };

        init();
    </script>
</body>
</html>
