<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass music</title>
    <style>
        :root {
            --neon: #A020F0;
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(160, 32, 240, 0.3);
            --blur: blur(45px);
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* GIF ФОН */
        #bg-gif {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; opacity: 0.5;
            transition: opacity 1.2s ease;
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: -1; }

        /* Навигация */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; position: fixed; width: calc(100% - 50px); top: 0; z-index: 1000;
        }
        .logo-center {
            font-size: 13px; font-weight: 700; letter-spacing: 5px; color: var(--neon);
            text-shadow: 0 0 15px var(--neon); text-transform: lowercase;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; transition: 0.3s cubic-bezier(0.2, 0, 0.2, 1);
        }
        .btn:active { transform: scale(0.9); }

        /* Экраны */
        .screen {
            position: absolute; inset: 0; display: none; 
            flex-direction: column; padding: 110px 25px 25px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(30px); z-index: 500;
        }
        .screen.active { display: flex; }

        /* Плеер */
        .player-content { text-align: left; margin-top: 15vh; padding-left: 5%; }
        .track-title { font-size: 42px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; margin-bottom: 8px; }
        .track-author { font-size: 18px; color: var(--neon); font-weight: 300; margin-bottom: 60px; opacity: 0.8; }
        .controls { display: flex; gap: 20px; }
        .controls .btn { width: 65px; height: 65px; font-size: 24px; }

        /* Поиск */
        .search-container {
            width: 100%; background: var(--glass); backdrop-filter: var(--blur);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 15px 20px; display: flex; align-items: center; box-sizing: border-box;
        }
        .search-container input { background: none; border: none; color: white; width: 100%; font-size: 18px; outline: none; }

        /* Списки */
        .list { margin-top: 20px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* Профиль */
        .profile-circle {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--neon); background: var(--glass);
            margin: 15vh auto 0; display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(160, 32, 240, 0.2);
        }
        .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <img id="bg-gif" src="">
    <div class="overlay"></div>

    <div class="nav">
        <div class="btn" onclick="toggleScreen('lib-screen')">☰</div>
        <div class="logo-center">cotakbass</div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="nav-prof-btn" onclick="toggleScreen('prof-screen')">👤</div>
            <div class="btn" onclick="toggleScreen('search-screen')">?</div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="player-screen" style="display: flex; flex-direction: column; padding: 110px 25px;">
        <div class="player-content">
            <div id="track-title" class="track-title">Загрузка...</div>
            <div id="track-author" class="track-author">Синхронизация с GitHub</div>
            <div id="debug-info" style="font-size:10px; opacity:0.3; margin-bottom:20px;"></div>
            <div class="controls">
                <div class="btn" onclick="prev()">❮</div>
                <div class="btn" id="play-btn" style="border-color: var(--neon)" onclick="playPause()">▶</div>
                <div class="btn" onclick="next()">❯</div>
            </div>
        </div>
    </div>

    <!-- БИБЛИОТЕКА -->
    <div id="lib-screen" class="screen">
        <div class="logo-center" style="position: static; margin-bottom: 30px; text-align: center; transform: none;">favorites</div>
        <div class="list" id="fav-list"></div>
    </div>

    <!-- ПОИСК -->
    <div id="search-screen" class="screen">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="напиши хуйню">
            <div style="color: var(--neon); font-weight: 800; font-size: 20px; margin-left: 10px;">?</div>
        </div>
        <div class="list" id="search-list"></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="prof-screen" class="screen">
        <div class="profile-circle" id="prof-btn-circle">
            <span id="plus">+</span>
            <img id="ava-img" style="display:none">
        </div>
        <input type="file" id="file-up" style="display:none" accept="image/*">
    </div>

    <script>
        const USER = "ChocolateBorodca"; 
        const REPO = "cotakbass_music"; 

        let tracks = [], gifs = [], curIdx = 0, isPlaying = false, curScreen = 'player-screen';
        const audio = new Audio();

        async function init() {
            const titleEl = document.getElementById('track-title');
            const authorEl = document.getElementById('track-author');
            const debugEl = document.getElementById('debug-info');

            try {
                // Прямой запрос к API
                const musicUrl = `https://github.com{USER}/${REPO}/contents/music`;
                const bgUrl = `https://github.com{USER}/${REPO}/contents/bg`;

                const [mRes, bRes] = await Promise.all([fetch(musicUrl), fetch(bgUrl)]);

                if (!mRes.ok) {
                    titleEl.innerText = "Ошибка GitHub";
                    authorEl.innerText = "Проверь папку music и Public статус";
                    debugEl.innerHTML = `URL: <a href="${musicUrl}" style="color:var(--neon)">кликни сюда</a>. Если там ошибка, значит папка не найдена.`;
                    return;
                }

                const mData = await mRes.json();
                tracks = mData.filter(f => f.name.toLowerCase().endsWith('.mp3')).map(f => ({
                    name: f.name.replace('.mp3', ''),
                    url: f.download_url
                }));

                if (bRes.ok) {
                    const bData = await bRes.json();
                    gifs = bData.filter(f => f.name.toLowerCase().endsWith('.gif')).map(f => f.download_url);
                }

                if (tracks.length > 0) {
                    update();
                    renderLibrary();
                } else {
                    titleEl.innerText = "Папка пуста";
                    authorEl.innerText = "Загрузи .mp3 в папку music";
                }
            } catch (e) {
                titleEl.innerText = "Ошибка сети";
                authorEl.innerText = "Выключи VPN или проверь интернет";
                console.error(e);
            }
        }

        function toggleScreen(id) {
            const screen = document.getElementById(id);
            if (curScreen === id) {
                screen.classList.remove('active');
                curScreen = 'player-screen';
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
                curScreen = id;
            }
        }

        function update() {
            if (tracks.length === 0) return;
            const t = tracks[curIdx];
            const parts = t.name.split(' - ');
            document.getElementById('track-title').innerText = parts[1] || parts[0];
            document.getElementById('track-author').innerText = parts[1] ? parts[0] : "Unknown Artist";
            
            if (gifs.length > 0) {
                document.getElementById('bg-gif').src = gifs[Math.floor(Math.random() * gifs.length)];
            }
            audio.src = t.url;
            if (isPlaying) audio.play();
        }

        function renderLibrary() {
            const list = document.getElementById('fav-list');
            list.innerHTML = "";
            tracks.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.name}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { curIdx = i; isPlaying = true; document.getElementById('play-btn').innerText = "Ⅱ"; update(); toggleScreen('lib-screen'); };
                list.appendChild(div);
            });
        }

        function playPause() {
            if (tracks.length === 0) return;
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerText = isPlaying ? "Ⅱ" : "▶";
            isPlaying ? audio.play() : audio.pause();
        }

        function next() { if(tracks.length > 0) { curIdx = (curIdx + 1) % tracks.length; update(); } }
        function prev() { if(tracks.length > 0) { curIdx = (curIdx - 1 + tracks.length) % tracks.length; update(); } }

        document.getElementById('search-input').oninput = (e) => {
            const v = e.target.value.toLowerCase();
            const list = document.getElementById('search-list');
            list.innerHTML = "";
            if (v.length < 1) return;
            tracks.filter(t => t.name.toLowerCase().includes(v)).forEach(t => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div>${t.name}</div><div class="btn" style="width:40px; height:40px">▶</div>`;
                div.onclick = () => { curIdx = tracks.indexOf(t); isPlaying = true; update(); toggleScreen('search-screen'); };
                list.appendChild(div);
            });
        };

        document.getElementById('prof-btn-circle').onclick = () => document.getElementById('file-up').click();
        document.getElementById('file-up').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('ava-img').src = ev.target.result;
                document.getElementById('ava-img').style.display = 'block';
                document.getElementById('plus').style.display = 'none';
                document.getElementById('nav-prof-btn').style.boxShadow = "0 0 15px #A020F0";
                document.getElementById('nav-prof-btn').style.borderColor = "#A020F0";
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        init();
    </script>
</body>
</html>
