<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cotakbass platform</title>
    <style>
        :root { --neon: #A020F0; --glass: rgba(255, 255, 255, 0.05); --blur: blur(45px); }
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; padding-bottom: 50px; }
        #bg-gif { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.3; }
        .overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7), #000); z-index: -1; }
        .nav { padding: 25px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); backdrop-filter: var(--blur); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-transform: lowercase; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; backdrop-filter: var(--blur); transition: 0.3s; }
        .card:hover { border-color: var(--neon); }
        .card h3 { margin: 0 0 8px 0; font-size: 20px; font-weight: 800; text-transform: lowercase; }
        .card span { font-size: 10px; color: var(--neon); opacity: 0.7; letter-spacing: 2px; display: block; margin-bottom: 10px; }
        audio { width: 100%; height: 40px; border-radius: 12px; filter: invert(1) hue-rotate(180deg); }
        .info-box { background: rgba(160, 32, 240, 0.1); border: 1px solid var(--neon); padding: 15px; border-radius: 15px; font-size: 13px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <img id="bg-gif" src="https://giphy.com">
    <div class="overlay"></div>

    <div class="nav"><div class="logo">cotakbass</div></div>

    <div class="container">
        <div class="info-box">
            Чтобы добавить трек, просто закинь его в папку <b>music</b> на GitHub. <br>Он появится здесь сам!
        </div>
        <div id="feed">
            <p style="text-align:center; opacity:0.3;">сканируем папку music...</p>
        </div>
    </div>

    <script>
        const USER = "ChocolateBorodca";
        const REPO = "cotakbass_music";

        async function loadGitHubMusic() {
            const feed = document.getElementById('feed');
            try {
                // Используем прокси AllOrigins чтобы GitHub API не заблочили
                const proxy = "https://allorigins.win";
                const target = encodeURIComponent(`https://github.com{USER}/${REPO}/contents/music`);
                
                const res = await fetch(proxy + target);
                const json = await res.json();
                const files = JSON.parse(json.contents);

                feed.innerHTML = "";

                if (!Array.isArray(files)) {
                    feed.innerHTML = "<p style='text-align:center'>Папка music пуста или не найдена.</p>";
                    return;
                }

                files.filter(f => f.name.endsWith('.mp3')).forEach(file => {
                    const trackName = file.name.replace('.mp3', '').replaceAll('_', ' ');
                    // Прямая ссылка через CDN jsDelivr (летает в РФ)
                    const audioUrl = `https://jsdelivr.net{USER}/${REPO}@main/music/${encodeURIComponent(file.name)}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span>OFFICIAL RELEASE</span>
                        <h3>${trackName}</h3>
                        <audio controls src="${audioUrl}"></audio>
                    `;
                    feed.appendChild(card);
                });

            } catch (e) {
                feed.innerHTML = "<p style='text-align:center'>Ошибка связи с GitHub. Попробуй обновить страницу.</p>";
            }
        }

        loadGitHubMusic();
    </script>
</body>
</html>
